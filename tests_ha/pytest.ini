# Own config for the Home Assistant suite, so pyproject.toml's `pythonpath` is not applied
# here: it puts custom_components/spot_forecast on sys.path for the pure tests' `import core`,
# where the integration's `statistics.py` would shadow the standard library module that
# Home Assistant imports. conftest.py puts the repo root on sys.path instead.
[pytest]
asyncio_mode = auto
