# Own config for the Home Assistant suite, so pyproject.toml's `pythonpath` (which puts
# custom_components/spot_forecast on sys.path for the pure tests' `import core`) does not
# apply here: the HA suite imports the integration only as `custom_components.spot_forecast`,
# the way Home Assistant loads it, and integration modules can never shadow top-level ones.
# conftest.py puts the repo root on sys.path instead.
[pytest]
asyncio_mode = auto
