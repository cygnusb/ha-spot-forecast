name: Validate

on:
  push:
  pull_request:
  schedule:
    # Daily, not weekly: the `latest` matrix entry below resolves to whatever
    # core pytest-homeassistant-custom-component currently pins, so this is
    # what picks up a new Home Assistant release without anyone pushing a
    # commit. A failing scheduled run notifies the repository owner.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    # The pure suite: core/ against numpy only. The training tests skip here
    # (no pandas or scikit-learn); tests-training runs them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      - run: pytest tests -q

  tests-training:
    # The same suite in the environment of the Train workflow, so the training
    # code is tested with the pandas and scikit-learn it runs on. Tests that
    # need the research raw data (not in the repository) skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r training/requirements.txt -r tests/requirements.txt
      - run: pytest tests -q

  tests-homeassistant:
    # The pure suite cannot see Home Assistant changing an API underneath us.
    # This one installs the real thing and sets the integration up end to end,
    # at both ends of the version range hacs.json promises.
    #
    # The Python version is what selects the core, and it does so silently:
    # Home Assistant requires >= 3.14.2 from 2026.3 on, so a job pinned to
    # 3.13 resolves to the newest release that still supported 3.13 instead of
    # failing.
    name: tests-homeassistant (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor from hacs.json.
          - label: HA 2024.11 (minimum)
            python: "3.13"
            phcc: pytest-homeassistant-custom-component==0.13.181
            # That release does not pin its transitive dependencies tightly
            # enough: today's josepy dropped ComparableX509, which the acme
            # version it pulls still imports at module level, and pycares 4.9
            # added a channel-shutdown thread that outlives the test and fails
            # PHCC's lingering-thread check.
            extra: "josepy<2 pycares<4.9"
          # Whatever core the current PHCC pins - the drift detector.
          - label: latest
            python: "3.14"
            phcc: pytest-homeassistant-custom-component
            extra: ""
            # Only this entry is supposed to be current; the floor is old on
            # purpose and must not be compared against PyPI.
            check_latest: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned Home Assistant core and the integration's requirements
        # EXTRA is a space-separated list, empty for most entries. numpy is the
        # manifest's requirement, which PHCC does not pull in. No frontend
        # package: unlike SBP, the integration does not depend on `frontend`.
        run: |
          read -ra extra <<< "$EXTRA"
          pip install "$PHCC" "${extra[@]}" numpy
        env:
          PHCC: ${{ matrix.phcc }}
          EXTRA: ${{ matrix.extra }}
      - name: Report the core actually under test
        run: python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"
      # Never collected together with tests/: tests_ha/pytest.ini is its own
      # config, without the pure suite's pythonpath.
      - run: pytest tests_ha -v

      - name: Check the tested core is the newest Home Assistant minor
        if: matrix.check_latest
        # Not a failure: after a Home Assistant release it takes
        # pytest-homeassistant-custom-component a few days to publish a
        # matching version, and a red repository for that is noise. It is a
        # warning annotation so a *lasting* gap - PHCC stalled, or the Python
        # version pinned above gone stale - is visible in the run.
        # Patch releases are ignored: only YYYY.M is compared.
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          from homeassistant.const import __version__ as installed
          from packaging.version import InvalidVersion, Version

          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/homeassistant/json", timeout=30
              ) as response:
                  releases = json.load(response)["releases"]
          except Exception as err:  # noqa: BLE001
              # This step only reports; it must never turn a green test run red
              # because PyPI was briefly unreachable.
              print(f"::warning::Could not ask PyPI for the newest release: {err}")
              raise SystemExit(0) from None

          published = []
          for raw in releases:
              try:
                  version = Version(raw)
              except InvalidVersion:
                  continue
              if not version.is_prerelease:
                  published.append(version)

          newest = max(published)
          current = Version(installed)
          summary = f"Tested Home Assistant {current}; newest release is {newest}"

          if (newest.major, newest.minor) > (current.major, current.minor):
              print(
                  f"::warning::{summary}. Either pytest-homeassistant-custom-component "
                  f"has not published support for {newest.major}.{newest.minor} yet, or "
                  "the Python version pinned for this job is too old for it and pip "
                  "silently resolved to an older core."
              )
          else:
              print(f"{summary} - same minor, patch releases are not tracked separately.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary + "\n")
          PY

  model-age:
    # The daily liveness check of the model channel: red once a published model is more than
    # 45 days old, whatever stopped the monthly training (its schedule switched off, data-lag
    # or gate-failure issues left unanswered). Quiet until the first model is published.
    # Only on the daily schedule and by hand: a push or pull request must not turn red over it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check_model_age.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: an unpinned formatter turns somebody else's ruff release into
      # a red build on a branch that changed nothing.
      - run: pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  keepalive:
    # GitHub switches scheduled workflows off after 60 days without repository activity.
    # Re-enabling this workflow at the end of every run keeps the daily schedule alive. Not on
    # pull requests, whose token cannot write.
    needs: [hassfest, hacs, tests, tests-training, tests-homeassistant, model-age, lint]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/enable"
