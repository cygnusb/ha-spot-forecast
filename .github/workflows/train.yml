name: Train

# Monthly model training. Refreshes the raw-data archive, trains every zone (training/zones.py)
# with the cutoff at the first of the month and publishes a zone's model to the rolling `models`
# release only if it passes the quality gate (training/gate.py). A failed gate or input data that
# is not published yet opens an issue and publishes nothing for that zone; any other error fails
# the run, which notifies the owner. One zone's failure never holds back another: the zones run
# one after the other and their manifests chain (training/ci_zones.py). The exception: DK1 and
# DK2 blend with the DE-LU model trained in the same run, so they are skipped (as errors) when
# the DE-LU training errors; a failed DE-LU gate does not stop them.
#
# Two jobs, so the token that can write never meets third-party code: `train` installs the
# hash-locked training dependencies and runs the training with a read-only token; `publish`
# installs nothing and checks nothing out, it only takes train's files (workflow artifacts)
# to the releases and the issues.

on:
  schedule:
    # The 3rd: the month before is complete in every source by then.
    - cron: "0 2 3 * *"
  workflow_dispatch:
    inputs:
      accept_incomparable:
        description: >-
          Only for the first run after a feature-schema change: let the gate pass although
          the published model cannot be compared (it needs skill > 0, and the MAE bar of any
          older model that can be). The release notes say the override was used.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    runs-on: ubuntu-latest
    # five zones, estimated 2.5 hours of training (7 monthly refits and the final fit, 3
    # quantiles each, 600 iterations) plus the fetch; the most a GitHub-hosted job may run
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      archived: ${{ steps.archive.outputs.archived }}
      read: ${{ steps.gate.outputs.read }}
      # space-separated: the versions to publish, the versions whose gate failed, the zones
      # waiting for data
      passed: ${{ steps.gate.outputs.passed }}
      failed: ${{ steps.gate.outputs.failed }}
      lagged: ${{ steps.gate.outputs.lagged }}
      manifest: ${{ steps.gate.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing is pushed; the token stays out of .git/config and away from the training code.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.lock
      # Every package pinned with its hashes (training/requirements.txt says how to update).
      - run: pip install --require-hashes -r training/requirements.lock

      - name: Restore the raw-data archive
        # Only a missing release (HTTP 404) or a release without the archive means a first
        # run, which fetches everything from scratch. Anything else fails the job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/data/raw
          code=$(curl -sS -o "$RUNNER_TEMP/training-data.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/training-data")
          case "$code" in
            200) ;;
            404) echo "::notice::No training-data release yet: fetching from scratch"; exit 0 ;;
            *) echo "::error::GitHub answered HTTP $code for the training-data release"; exit 1 ;;
          esac
          if ! jq -e '.assets | any(.name == "raw.tar.gz")' "$RUNNER_TEMP/training-data.json" >/dev/null; then
            echo "::notice::The training-data release has no raw.tar.gz: fetching from scratch"
            exit 0
          fi
          gh release download training-data -p raw.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/raw.tar.gz" -C training/data

      - name: Fetch the new raw data
        # Incremental, up to yesterday, for every zone (the weather points are shared).
        run: python -m training.fetch --raw training/data/raw

      - name: Archive the raw data
        id: archive
        # A whitelist: the public archive holds only the openly licensed (CC BY) inputs from
        # Energy-Charts and Open-Meteo, never research-only files that may not be shared.
        # The publish job uploads it, also when the training below fails.
        run: |
          tar -czf raw.tar.gz -C training/data raw/prices/ raw/weather/ raw/installed_power.json
          echo "archived=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: raw.tar.gz
          retention-days: 1

      - name: Download the published manifest and models
        # Same rule as the archive: only a missing release or manifest means a first run. A
        # manifest that cannot be read must never be replaced by one without the other zones.
        # Per zone, into previous/<zone>/: besides the manifest's model (checked against its
        # SHA-256), up to two older ones that are not revoked: the gate compares with the best
        # of them, so a run of models, each a little worse than the one before, cannot pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          code=$(curl -sS -o "$RUNNER_TEMP/models.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/models")
          case "$code" in
            200) ;;
            404) echo "::notice::No models release yet: first run"; exit 0 ;;
            *) echo "::error::GitHub answered HTTP $code for the models release"; exit 1 ;;
          esac
          if ! jq -e '.assets | any(.name == "manifest.json")' "$RUNNER_TEMP/models.json" >/dev/null; then
            echo "::notice::The models release has no manifest.json: first run"
            exit 0
          fi
          gh release download models -p manifest.json -D previous
          for zone in $(python -m training.zones); do
            mkdir -p "previous/$zone"
            name=$(jq -r --arg z "$zone" '.zones[$z].model.name // empty' previous/manifest.json)
            if [ -z "$name" ]; then
              echo "::notice::The manifest has no model for $zone yet"
              continue
            fi
            sha=$(jq -r --arg z "$zone" '.zones[$z].model.sha256' previous/manifest.json)
            gh release download models -p "$name" -D "previous/$zone"
            echo "$sha  previous/$zone/$name" | sha256sum -c -
            older=$(jq -r --arg z "$zone" --arg n "$name" --slurpfile m previous/manifest.json '
              [.assets[]
                | select(.name | test("^" + $z + "-[0-9]{4}-[0-9]{2}\\.json\\.gz$"))
                | select(.name < $n)
                | select((.name | rtrimstr(".json.gz")) as $v
                    | ($m[0].revoked // []) | index($v) | not)]
              | sort_by(.name) | .[-2:][] | "\(.name) \(.digest // "")"' "$RUNNER_TEMP/models.json")
            while read -r asset digest; do
              [ -n "$asset" ] || continue
              gh release download models -p "$asset" -D "previous/$zone"
              # GitHub's own checksum of the asset, where it has one
              if [ -n "$digest" ]; then echo "${digest#sha256:}  previous/$zone/$asset" | sha256sum -c -; fi
            done <<< "$older"
          done

      - name: Train and run the quality gate
        id: ci
        # Every zone, also after one failed (training/ci_zones.py). Exit 1 when a zone errored:
        # the other zones' results are still read, handed on and published, and the last step
        # fails the job. A data lag (an input not published yet) is reported as an issue by the
        # publish job.
        env:
          # Never on the schedule: only a run started by hand can set the override.
          ACCEPT_INCOMPARABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_incomparable == true }}
        run: |
          mkdir -p out
          args=(--raw training/data/raw --out out --cutoff "$(date -u +%Y-%m-01)" --previous previous)
          if [ "$ACCEPT_INCOMPARABLE" = true ]; then
            echo "::warning::Started with accept_incomparable: an incomparable published model does not fail the gate"
            args+=(--accept-incomparable)
          fi
          rc=0
          python -m training.ci_zones "${args[@]}" 2>out/ci-stderr.txt || rc=$?
          cat out/ci-stderr.txt >&2
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ ! -f out/summary.json ]; then
            echo "::error::training.ci_zones stopped before it wrote out/summary.json"
            exit 1
          fi

      - name: Read the gate results
        id: gate
        # A zone's version is either to publish, failed or already published (a rerun in a
        # month whose version the manifest already lists: a published version is never
        # replaced, so nothing is uploaded or reported for it).
        run: |
          passed=$(jq -r '.passed | join(" ")' out/summary.json)
          failed=$(jq -r '.failed | join(" ")' out/summary.json)
          lagged=$(jq -r '.lagged | join(" ")' out/summary.json)
          errors=$(jq -r '.errors | join(" ")' out/summary.json)
          if [ -f out/manifest.json ]; then manifest=true; else manifest=false; fi
          if [ -n "$passed" ] && [ "$manifest" = false ]; then
            echo "::error::Gates passed ($passed) but training.ci_zones wrote no manifest"
            exit 1
          fi
          jq -r '.zones[] | select(.already_published == true)
            | "::notice::\(.version) is already published and is never replaced: nothing uploaded"' \
            out/summary.json
          {
            echo "read=true"
            echo "passed=$passed"
            echo "failed=$failed"
            echo "lagged=$lagged"
            echo "errors=$errors"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.read == 'true'
        with:
          name: out
          path: out/
          retention-days: 7

      - name: Fail the run for a zone that errored
        # After the hand-over: the publish job still publishes the zones that passed.
        if: steps.gate.outputs.errors != ''
        env:
          ERRORS: ${{ steps.gate.outputs.errors }}
        run: |
          echo "::error::Training failed for $ERRORS (see the step above)"
          exit 1

  publish:
    # No checkout and no installs: only gh, jq and sha256sum from the runner image touch the
    # files with a token that can write.
    needs: train
    # always(): the train job fails in its last step when a zone errored, and its outputs,
    # set by the steps before, still hold the zones that passed.
    if: always() && needs.train.outputs.archived == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw-data
      - uses: actions/download-artifact@v4
        if: needs.train.outputs.read == 'true'
        with:
          name: out
          path: out

      - name: Upload the raw-data archive
        run: |
          if ! gh release view training-data >/dev/null 2>&1; then
            gh release create training-data --title "Training data" --latest=false --prerelease --notes "Raw inputs of the monthly model training, refreshed by the Train workflow: day-ahead prices and installed capacity from Energy-Charts (price data: Bundesnetzagentur | SMARD.de, CC BY 4.0) and weather forecasts from Open-Meteo (CC BY 4.0)."
          fi
          # Also a release created by hand (the bootstrap): HACS must never offer it.
          gh release edit training-data --prerelease --latest=false
          gh release upload training-data raw.tar.gz --clobber

      - name: Keep the models release out of HACS
        # Also a release created by hand (the bootstrap): HACS must never offer it.
        run: |
          if gh release view models >/dev/null 2>&1; then
            gh release edit models --prerelease --latest=false
          fi

      - name: Publish the models
        if: needs.train.outputs.passed != '' && needs.train.outputs.manifest == 'true'
        # The versioned assets are immutable: uploaded without --clobber, so an existing name
        # fails the step. The manifest goes up last and once, so it never names an asset that
        # is not there yet, and only if it names these very files (and versions). The release
        # notes get the new reports on top of the earlier ones.
        env:
          PASSED: ${{ needs.train.outputs.passed }}
        run: |
          for version in $PASSED; do
            zone="${version%-[0-9][0-9][0-9][0-9]-[0-9][0-9]}"
            for kind in model backfill; do
              jq -er --arg z "$zone" --arg v "$version" --arg k "$kind" \
                '.zones[$z] | select(.version == $v) | .[$k] | "\(.sha256)  out/\($z)/\(.name)"' \
                out/manifest.json | sha256sum -c -
            done
          done
          if ! gh release view models >/dev/null 2>&1; then
            gh release create models --title "Models" --latest=false --prerelease --notes "Rolling release of the published models. manifest.json lists the current model of every zone."
          fi
          : > "$RUNNER_TEMP/new-notes.md"
          for version in $PASSED; do
            zone="${version%-[0-9][0-9][0-9][0-9]-[0-9][0-9]}"
            gh release upload models "out/$zone/$version.json.gz" "out/$zone/$version.backfill.json.gz" "out/$zone/$version.report.md"
            {
              cat "out/$zone/release-notes.md"
              printf '\n---\n\n'
            } >> "$RUNNER_TEMP/new-notes.md"
          done
          gh release upload models out/manifest.json --clobber
          gh release view models --json body -q .body > "$RUNNER_TEMP/earlier-notes.md"
          cat "$RUNNER_TEMP/new-notes.md" "$RUNNER_TEMP/earlier-notes.md" > "$RUNNER_TEMP/notes.md"
          gh release edit models --notes-file "$RUNNER_TEMP/notes.md"

      - name: Open an issue per failed gate
        if: needs.train.outputs.failed != ''
        env:
          FAILED: ${{ needs.train.outputs.failed }}
        run: |
          for version in $FAILED; do
            zone="${version%-[0-9][0-9][0-9][0-9]-[0-9][0-9]}"
            title="Model training gate failed for $version"
            open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
              | jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // empty')
            if [ -n "$open" ]; then
              echo "::notice::Issue #$open is still open for $version: not opening another"
              continue
            fi
            gh issue create --title "$title" --body-file "out/$zone/issue.md"
          done

      - name: Open an issue for the data lag
        if: needs.train.outputs.lagged != ''
        env:
          LAGGED: ${{ needs.train.outputs.lagged }}
        run: |
          {
            echo "The monthly training of $LAGGED stopped before training: an input is not"
            echo "published yet. Nothing was published for it and its current model stays"
            echo "active. Rerun the Train workflow once the data is there."
            echo
            echo '```'
            tail -n 100 out/ci-stderr.txt
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/data-lag.md"
          title="Model training waiting for data"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // empty')
          if [ -n "$open" ]; then
            echo "::notice::Issue #$open is still open for this: not opening another"
            exit 0
          fi
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/data-lag.md"

  keepalive:
    # GitHub switches scheduled workflows off after 60 days without repository activity.
    # Re-enabling this workflow at the end of every run keeps the monthly schedule alive; the
    # daily model-age check in validate.yml turns red if it stops anyway.
    needs: [train, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/train.yml/enable"
