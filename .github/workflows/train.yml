name: Train

# Monthly model training. Refreshes the raw-data archive, trains with the cutoff at the first
# of the month and publishes to the rolling `models` release only if the candidate passes the
# quality gate (training/gate.py). A failed gate or input data that is not published yet opens
# an issue and publishes nothing; any other error fails the run, which notifies the owner.

on:
  schedule:
    # The 3rd: the month before is complete in every source by then.
    - cron: "0 2 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: train
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing is pushed; the token stays out of .git/config and away from the training code.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r training/requirements.txt

      - name: Restore the raw-data archive
        # Only a missing release (HTTP 404) or a release without the archive means a first
        # run, which fetches everything from scratch. Anything else fails the job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/data/raw
          code=$(curl -sS -o "$RUNNER_TEMP/training-data.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/training-data")
          case "$code" in
            200) ;;
            404) echo "::notice::No training-data release yet: fetching from scratch"; exit 0 ;;
            *) echo "::error::GitHub answered HTTP $code for the training-data release"; exit 1 ;;
          esac
          if ! jq -e '.assets | any(.name == "raw.tar.gz")' "$RUNNER_TEMP/training-data.json" >/dev/null; then
            echo "::notice::The training-data release has no raw.tar.gz: fetching from scratch"
            exit 0
          fi
          gh release download training-data -p raw.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/raw.tar.gz" -C training/data

      - name: Fetch the new raw data
        # Incremental, up to yesterday.
        run: python -m training.fetch --raw training/data/raw

      - name: Archive the raw data
        # A whitelist: the public archive holds only the openly licensed (CC BY) inputs from
        # Energy-Charts and Open-Meteo, never research-only files that may not be shared.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf raw.tar.gz -C training/data raw/prices/ raw/weather/ raw/installed_power.json
          if ! gh release view training-data >/dev/null 2>&1; then
            gh release create training-data --title "Training data" --latest=false --notes "Raw inputs of the monthly model training, refreshed by the Train workflow: day-ahead prices and installed capacity from Energy-Charts (price data: Bundesnetzagentur | SMARD.de, CC BY 4.0) and weather forecasts from Open-Meteo (CC BY 4.0)."
          fi
          gh release upload training-data raw.tar.gz --clobber

      - name: Download the published manifest and model
        id: previous
        # Same rule as the archive: only a missing release or manifest means a first run. A
        # manifest that cannot be read must never be replaced by one without the other zones.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          code=$(curl -sS -o "$RUNNER_TEMP/models.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/models")
          case "$code" in
            200) ;;
            404) echo "::notice::No models release yet: first run"; exit 0 ;;
            *) echo "::error::GitHub answered HTTP $code for the models release"; exit 1 ;;
          esac
          if ! jq -e '.assets | any(.name == "manifest.json")' "$RUNNER_TEMP/models.json" >/dev/null; then
            echo "::notice::The models release has no manifest.json: first run"
            exit 0
          fi
          gh release download models -p manifest.json -D previous
          echo "manifest=previous/manifest.json" >> "$GITHUB_OUTPUT"
          zone=$(python -c 'from training.train import ZONE; print(ZONE)')
          name=$(jq -r --arg z "$zone" '.zones[$z].model.name // empty' previous/manifest.json)
          if [ -z "$name" ]; then
            echo "::notice::The manifest has no model for $zone yet"
            exit 0
          fi
          sha=$(jq -r --arg z "$zone" '.zones[$z].model.sha256' previous/manifest.json)
          gh release download models -p "$name" -D previous
          echo "$sha  previous/$name" | sha256sum -c -
          echo "model=previous/$name" >> "$GITHUB_OUTPUT"

      - name: Train and run the quality gate
        id: ci
        # Exit 2 is a data lag (an input is not published yet): reported as an issue below.
        # Every other non-zero exit fails the job.
        env:
          PREVIOUS_MANIFEST: ${{ steps.previous.outputs.manifest }}
          PREVIOUS_MODEL: ${{ steps.previous.outputs.model }}
        run: |
          mkdir -p out
          args=(--raw training/data/raw --out out --cutoff "$(date -u +%Y-%m-01)")
          if [ -n "$PREVIOUS_MANIFEST" ]; then args+=(--previous-manifest "$PREVIOUS_MANIFEST"); fi
          if [ -n "$PREVIOUS_MODEL" ]; then args+=(--previous-model "$PREVIOUS_MODEL"); fi
          rc=0
          python -m training.ci "${args[@]}" 2>out/ci-stderr.txt || rc=$?
          cat out/ci-stderr.txt >&2
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi

      - name: Read the gate result
        id: gate
        if: steps.ci.outputs.rc == '0'
        run: |
          passed=$(jq -r '.passed == true' out/gate.json)
          version=$(jq -r '.version' out/gate.json)
          if [ -f out/manifest.json ]; then manifest=true; else manifest=false; fi
          if [ "$passed" = true ] && [ "$manifest" = false ]; then
            echo "::error::The gate passed but training.ci wrote no manifest"
            exit 1
          fi
          {
            echo "passed=$passed"
            echo "version=$version"
            echo "manifest=$manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the model
        if: steps.gate.outputs.passed == 'true' && steps.gate.outputs.manifest == 'true'
        # The manifest goes up last, so it never names an asset that is not there yet.
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view models >/dev/null 2>&1; then
            gh release create models --title "Models" --latest=false --notes "Rolling release of the published models. manifest.json lists the current model of every zone."
          fi
          gh release upload models "out/$VERSION.json.gz" "out/$VERSION.backfill.json.gz" "out/$VERSION.report.md" --clobber
          gh release upload models out/manifest.json --clobber
          gh release edit models --notes-file out/release-notes.md

      - name: Open an issue for the failed gate
        if: steps.ci.outputs.rc == '0' && steps.gate.outputs.passed != 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Model training gate failed for $VERSION" --body-file out/issue.md

      - name: Open an issue for the data lag
        if: steps.ci.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The monthly training stopped before training: an input is not published yet."
            echo "Nothing was published and the current model stays active. Rerun the Train"
            echo "workflow once the data is there."
            echo
            echo '```'
            tail -n 100 out/ci-stderr.txt
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/data-lag.md"
          gh issue create --title "Model training waiting for data" --body-file "$RUNNER_TEMP/data-lag.md"
